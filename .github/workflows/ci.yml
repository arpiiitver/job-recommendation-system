name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobrec
          POSTGRES_PASSWORD: jobrec
          POSTGRES_DB: jobrec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jobrec -d jobrec_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://jobrec:jobrec@localhost:5432/jobrec_test
      EMBEDDING_BACKEND: hashing
      LLM_ENABLED: "false"
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Compile
        working-directory: backend
        run: python -m compileall app ml
      # Integration tests need the demo accounts + golden job corpus; a fresh
      # CI database has neither (tests previously relied on a hand-built DB).
      - name: Seed demo data
        working-directory: backend
        run: python -m scripts.seed_demo
      - name: Tests
        working-directory: backend
        # On failure, surface the failing tests / collection errors as
        # annotations so they show on the commit page without opening logs.
        run: |
          pytest -q -rfE 2>&1 | tee pytest.log || {
            grep -E "^(ERROR|FAILED|E  )" pytest.log | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            tail -3 pytest.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npx next build
